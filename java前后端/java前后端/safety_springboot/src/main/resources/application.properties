spring.application.name=Kcsj
mybatis.mapper-locations=classpath:mappers/*xml
mybatis.type-aliases-package=com.example.Kcsj.mybatis.entity
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.name=defaultDataSource
spring.datasource.url=jdbc:mysql://localhost:3306/yoloai?serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=123456
server.port=9999
file.ip=127.0.0.1
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# ================= 邮箱验证码（SMTP） =================
# 不配置 SMTP（host / password 为空）时自动进入演示模式：验证码直接随接口返回，方便本地演示
# 配置真实邮箱：设置 MAIL_HOST / MAIL_USERNAME / MAIL_PASSWORD 环境变量（授权码，不是登录密码）
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
app.mail.from=${MAIL_USERNAME:}
# 是否强制注册前完成邮箱验证（true 时小程序注册需同步加验证码，默认关闭）
app.mail.require-code=false

# ================= 智能问答在线大模型（OpenAI 兼容协议） =================
# 密钥只从环境变量读取，不写死在代码/仓库里；未配置时自动降级为内置房建安全知识库。
# 启动前设置环境变量：AI_CHAT_API_KEY=你的密钥（Kimi / 豆包 / DeepSeek / 通义 任选其一）
#
# Kimi（Moonshot）  ai.chat.base-url=https://api.moonshot.cn/v1/chat/completions   ai.chat.model=moonshot-v1-8k
# 豆包（火山方舟）  ai.chat.base-url=https://ark.cn-beijing.volces.com/api/v3/chat/completions  ai.chat.model=你的接入点ID
# DeepSeek          ai.chat.base-url=https://api.deepseek.com/chat/completions    ai.chat.model=deepseek-chat
# 通义千问          ai.chat.base-url=https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions  ai.chat.model=qwen-plus
#
# 默认使用 Kimi：换服务商时只改下面两行 + 设置对应的 AI_CHAT_API_KEY 即可
ai.chat.base-url=https://api.moonshot.cn/v1/chat/completions
ai.chat.model=moonshot-v1-8k
ai.chat.api-key=${AI_CHAT_API_KEY:}

# ================= 智能问答模型通道 =================
# auto：扣子智能体优先，其次 OpenAI 兼容在线模型，最后降级到内置知识库
# 只想要内置知识库：ai.provider=local
ai.provider=auto

# ---- 扣子（Coze）智能体：需要访问令牌 PAT + Bot ID ----
# 启动前设置环境变量：COZE_API_TOKEN=你的PAT  COZE_BOT_ID=你的BotID
ai.coze.base-url=https://api.coze.cn
ai.coze.pat=${COZE_API_TOKEN:}
ai.coze.bot-id=${COZE_BOT_ID:}
ai.coze.user-id=zhuan-eye-web




